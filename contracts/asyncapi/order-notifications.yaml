asyncapi: 2.6.0
info:
  title: Order Notifications API
  description: >
    Contrat d'interface WebSocket (lecture seule) du micro-service de commandes.
    Le mock rejoue toujours le même exemple de message défini ci-dessous.
  version: 1.0.0
defaultContentType: application/json
servers:
  websocket:
    url: ws://localhost:8586
    protocol: ws
channels:
  orders/notifications:
    bindings:
      ws:
        method: GET
    subscribe:
      summary: Notification poussée par le serveur à chaque abonnement du client
      operationId: subscribeOrderNotifications
      message:
        $ref: '#/components/messages/OrderNotification'
components:
  messages:
    OrderNotification:
      name: OrderNotification
      title: Notification de commande
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderNotificationPayload'
      examples:
        - name: default
          summary: Message rejoué en boucle par le mock
          payload:
            id: "ORD-1001"
            status: "CONFIRMED"
            amount: 129.90
            customerId: "CUST-42"
  schemas:
    OrderNotificationPayload:
      type: object
      required: [id, status, amount, customerId]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
        amount:
          type: number
          format: double
        customerId:
          type: string
