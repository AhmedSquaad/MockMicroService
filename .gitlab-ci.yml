# Exemple de pipeline GitLab CI : démarre le mock Microcks (REST + WebSocket)
# piloté par les contrats de contracts/, exécute des tests d'intégration contre
# les deux canaux, puis arrête proprement le mock. À adapter/copier dans le
# pipeline du micro-service consommateur du mock.
#
# Prérequis côté GitLab Runner : ce job utilise le service `docker:26.1-dind`
# (Docker-in-Docker) pour pouvoir lancer `docker-compose` à l'intérieur du job.
# Cela nécessite un runner avec l'executor `docker` configuré en mode privilégié
# dans /etc/gitlab-runner/config.toml :
#   [[runners]]
#     executor = "docker"
#     [runners.docker]
#       privileged = true
#       # volumes = ["/certs/client", "/cache"]  # optionnel, cache TLS entre jobs
# Sans `privileged = true`, le service dind ne peut pas démarrer et le job échoue
# avec une erreur de type "Cannot connect to the Docker daemon".
#
# Alternative sans dind (DooD) : si le runner autorise déjà le montage du socket
# hôte (`/var/run/docker.sock:/var/run/docker.sock`), on peut supprimer le
# service `docker:26.1-dind` et les variables DOCKER_HOST/TLS ci-dessous, et
# utiliser directement "localhost" à la place de `${MICROCKS_HOST}`. Cette
# approche partage le daemon Docker de l'hôte runner (moins isolé mais plus
# rapide, pas de démarrage de dind à chaque job).

stages:
  - integration-test

variables:
  # Docker-in-Docker : le service dind est joignable depuis le job via l'alias "docker"
  # (et non "localhost", puisque les conteneurs docker-compose tournent dans le dind).
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"
  MICROCKS_HOST: docker
  COMPOSE_VERSION: "2.29.2"

integration-test:mock:
  stage: integration-test
  image: docker:26.1
  services:
    - docker:26.1-dind
  before_script:
    - apk add --no-cache curl bash nodejs npm
    - curl -sSL "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
    - chmod +x /usr/local/bin/docker-compose
    # wscat se ferme immédiatement sans rien recevoir si stdin n'est pas un TTY
    # (toujours le cas en CI) : on utilise scripts/ws-test.js (lib `ws`) à la place.
    - npm install -g ws
  script:
    - echo "Démarrage du mock Microcks (build de l'image maison contract-importer + REST + WebSocket)..."
    - docker-compose up -d --build

    - |
      echo "Attente de la fin de l'injection des contrats par contract-importer..."
      # /api/services répond dès le démarrage de Microcks, avant même que les
      # contrats soient chargés : on attend donc la fin (succès ou échec) du
      # conteneur one-shot contract-importer plutôt que la seule dispo de Microcks.
      IMPORTER_EXIT_CODE=$(docker wait contract-importer)
      docker-compose logs contract-importer
      if [ "$IMPORTER_EXIT_CODE" != "0" ]; then
        echo "contract-importer a échoué (exit code ${IMPORTER_EXIT_CODE})"
        exit 1
      fi

    - echo "Test REST -- GET conforme au contrat (attendu 200 + payload ORD-1001)"
    - |
      curl -sf "http://${MICROCKS_HOST}:8585/rest/Order+Service+API/1.0.0/orders/ORD-1001" | tee /tmp/get.json
      grep -q '"status":"CONFIRMED"' /tmp/get.json

    - echo "Test REST -- POST valide (attendu 201)"
    - |
      code=$(curl -s -o /tmp/post-valid.json -w "%{http_code}" -X POST \
        "http://${MICROCKS_HOST}:8585/rest/Order+Service+API/1.0.0/orders" \
        -H "Content-Type: application/json" \
        -d '{"customerId":"CUST-42","amount":129.90}')
      test "$code" = "201"

    - echo "Test REST -- POST non conforme au contrat (attendu 400)"
    - |
      code=$(curl -s -o /tmp/post-invalid.json -w "%{http_code}" -X POST \
        "http://${MICROCKS_HOST}:8585/rest/Order+Service+API/1.0.0/orders" \
        -H "Content-Type: application/json" \
        -d '{"amount":"pas-un-nombre"}')
      test "$code" = "400"

    - echo "Test WebSocket -- abonnement en lecture seule (attendu le message ORD-1001 rejoué)"
    - |
      NODE_PATH="$(npm root -g)" node scripts/ws-test.js \
        "ws://${MICROCKS_HOST}:8586/api/ws/Order+Notifications+API/1.0.0/orders/notifications" \
        10000 "ORD-1001"
  after_script:
    - docker-compose logs --no-color > docker-compose.log 2>&1 || true
    - docker-compose down -v || true
  artifacts:
    when: always
    paths:
      - docker-compose.log
    expire_in: 1 week
