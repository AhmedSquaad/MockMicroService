# Pipeline CI de l'application C++/Qt6 (Conan + CMake + GTest).
#
# 2 stages, 3 jobs :
#   build          -> compile l'app + les tests DANS l'image builder (construite
#                     au préalable en local depuis le Dockerfile : toolchain +
#                     cache Conan DÉJÀ rempli). conan install retrouve tout dans
#                     le cache embarqué, aucune compilation de dépendance, puis
#                     publie build/ en artefact.
#   test:unit      -> exécute les tests unitaires (hors-ligne, API mockée).
#   test:contrat   -> exécute les tests de contrat contre un Microcks lancé en
#                     SERVICE GitLab (pas de Docker-in-Docker, pas de privileged).
#
# Les jobs de test réutilisent l'artefact build/ et lancent directement les
# binaires : aucune librairie à installer (RPATH -> build/lib).
#
# Pré-requis : l'image builder doit exister dans le registry GitLab du projet.
# Construisez-la et poussez-la (hors CI) avec :
#   scripts/push-image.sh

stages:
  - build
  - test

variables:
  # Image builder construite depuis le Dockerfile et poussée dans le registry
  # GitLab (cf. scripts/push-image.sh), hors CI.
  BUILDER_IMAGE: "registry.gitlab.com/squaad.io/mockmicroservice"

build:
  stage: build
  # L'image embarque la toolchain ET le cache Conan : pas de before_script,
  # pas d'install de dépendances, pas de compilation de Qt/GTest.
  image: "${BUILDER_IMAGE}"
  variables:
    # Cache Conan embarqué dans l'image (cf. CONAN_HOME du Dockerfile).
    CONAN_HOME: "/opt/conan2"
  script:
    # Dépendances dynamiques (dans build/conan) + libs runtime déployées dans build/lib.
    # Tout est déjà dans le cache de l'image : --build=missing ne compile rien.
    - conan install . --lockfile=conan.lock --output-folder=build/conan --build=missing -s build_type=Release
        -o "*:shared=True" --deployer=runtime_deploy --deployer-folder=build/lib
    # Les outils hôtes de Qt (qmlimportscanner, moc) ont besoin des libs déployées au build.
    - export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/build/lib:${LD_LIBRARY_PATH:-}"
    - cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE="${CI_PROJECT_DIR}/build/conan/conan_toolchain.cmake"
        -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${CI_PROJECT_DIR}/build"
    - cmake --build build/cmake
  artifacts:
    paths:
      - build/ecommerce
      - build/orders_unit_tests
      - build/orders_contract_tests
      - build/lib/
    expire_in: 1 day

test:unit:
  stage: test
  image: ubuntu:24.04
  needs: ["build"]
  script:
    # Binaire auto-suffisant : aucune lib à installer (RPATH -> build/lib).
    - ./build/orders_unit_tests --gtest_output=xml:report-unit.xml
  artifacts:
    when: always
    reports:
      junit: report-unit.xml

test:contrat:
  stage: test
  image: ubuntu:24.04
  needs: ["build"]
  services:
    - name: quay.io/microcks/microcks-uber:latest
      alias: microcks
  variables:
    # Les tests de contrat tapent le service Microcks via son alias (port 8080).
    MOCK_BASE_URL: "http://microcks:8080/rest/Order+Service+API/1.0.0"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    - |
      echo "Attente de Microcks..."
      until curl -sf "http://microcks:8080/api/services" > /dev/null; do sleep 2; done
      curl -sf -X POST "http://microcks:8080/api/artifact/upload?mainArtifact=true" \
        -F "file=@tests/contrat/orders/contracts/openapi/order-service.yaml"
  script:
    - ./build/orders_contract_tests --gtest_output=xml:report-contract.xml
  artifacts:
    when: always
    reports:
      junit: report-contract.xml
