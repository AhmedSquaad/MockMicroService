# MockMicroService - Mock REST + WebSocket piloté par contrats (OpenAPI / AsyncAPI)
# Aucune ligne de code : les mocks sont entièrement générés à partir des fichiers
# placés dans ./contracts/openapi et ./contracts/asyncapi

services:
  microcks:
    image: quay.io/microcks/microcks-uber:latest
    container_name: microcks
    restart: on-failure
    ports:
      - "8585:8080"
    environment:
      - ASYNC_MINION_URL=http://microcks-async-minion:8081
    # microcks-async-minion crashe s'il démarre avant que Microcks soit réellement
    # prêt (l'appli Spring Boot met ~10s à démarrer) : ce healthcheck permet aux
    # services dépendants d'attendre l'état "healthy" plutôt que le seul démarrage
    # du conteneur.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/services"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  microcks-async-minion:
    image: quay.io/microcks/microcks-uber-async-minion:latest
    container_name: microcks-async-minion
    depends_on:
      microcks:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8586:8081"
    environment:
      - MICROCKS_HOST_PORT=microcks:8080

  # Service "one-shot" qui injecte automatiquement les contrats au démarrage.
  # Contrats et script montés en bind-mount (pas une image "maison" reconstruite
  # à chaque contrat) : pour mocker un µService supplémentaire ou faire évoluer
  # son contrat, il suffit de déposer/éditer un fichier sous contracts/ et de
  # relancer ce conteneur — aucun build, aucune modification de code requise.
  # (microcks-cli >= 1.0 exige une session "login" ; on utilise directement
  # l'API REST d'upload d'artifact, sans authentification, comme le script
  # scripts/inject-contract.sh)
  contract-importer:
    image: curlimages/curl:8.10.1
    container_name: contract-importer
    entrypoint: ["sh", "/scripts/upload-contracts.sh"]
    volumes:
      - ./contracts:/contracts:ro
      - ./scripts/upload-contracts.sh:/scripts/upload-contracts.sh:ro
    environment:
      - MICROCKS_URL=http://microcks:8080
    depends_on:
      microcks:
        condition: service_healthy
      microcks-async-minion:
        condition: service_started
    restart: "no"
